# NROM-128 (mapper 0): 16 KB PRG at $C000 (mirrored at $8000), 8 KB CHR.
# The smallest standard layout, so the ROM fits any game slot of a SUP/VT02 multicart.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    OAM:    start = $0200, size = $0100, type = rw, file = "";
    RAM:    start = $0300, size = $0500, type = rw, file = "";
    HDR:    start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG:    start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, type = ro, file = %O, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    OAM:      load = OAM, type = bss, align = $100;
    BSS:      load = RAM, type = bss;
    HEADER:   load = HDR, type = ro;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    VECTORS:  load = PRG, type = ro, start = $FFFA;
    CHARS:    load = CHR, type = ro;
}
